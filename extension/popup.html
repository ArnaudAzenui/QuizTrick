<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QuizTrick</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body data-state="reading">
    <header class="header">
      <h1 class="brand">QuizTrick</h1>
      <p id="source" class="source"></p>
    </header>

    <main class="main">
      <p id="title" class="title" hidden></p>
      <pre id="preview" class="preview" hidden></pre>
      <p id="count" class="count" aria-live="polite"></p>
      <p id="status" class="status" role="status" data-tone="muted">Reading this page…</p>
      <button id="send" class="send" type="button" disabled>Send to QuizTrick</button>
      <section id="files" class="files" aria-labelledby="files-title" hidden>
        <h2 id="files-title" class="files-title">Files on this page</h2>
        <ul id="file-list" class="file-list"></ul>
      </section>
      <p id="target" class="target" hidden></p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
